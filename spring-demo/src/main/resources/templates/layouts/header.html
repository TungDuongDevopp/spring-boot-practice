<!DOCTYPE html>
<html
		xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
	<title>Header @hoidanit</title>
</head>

<body>
	<header th:fragment="header(currentPage)">
		<nav class="navbar navbar-expand-lg bg-body-tertiary">
			<div class="container">
				<a class="navbar-brand" href="/">Hỏi Dân IT</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
					data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
					aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item">
							<a class="nav-link" aria-current="page" href="/"
								th:classappend="${currentPage == 'home'} ? 'active' ">Home</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/user"
								th:classappend="${currentPage == 'user'} ? 'active' ">Manage User</a>
						</li>
					</ul>
					<div sec:authorize="isAuthenticated()" style="margin-right: 20px">
						<span>
							Welcome,
							<strong sec:authentication="name"></strong>
						</span>
					</div>

					<div class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
							aria-expanded="false">
							Settings
						</a>
						<ul class="dropdown-menu">
							<li sec:authorize="!isAuthenticated()"><a class="dropdown-item"
									th:href="@{/login}">Login</a></li>
							<li sec:authorize="isAuthenticated()">
								<form th:method="POST" th:action="@{/logout}">
									<button class="dropdown-item">Logout</button>
								</form>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</nav>
	</header>
</body>

</html>
