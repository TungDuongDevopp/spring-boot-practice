<!DOCTYPE html>
<html>

<head>
	<title>Update User</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	      rel="stylesheet">

</head>

<body>
	<div style="padding: 15px; margin-top: 15px">
		<div style="width: 600px; margin: 0 auto;">
			<h3 >Update a new user</h3>
			<hr />
			<form method="post" th:action="@{/user/update}" th:object="${user}">
				<input type="hidden" th:field="*{id}">
				<div class="mb-3" >
					<label class="form-label">Name</label>
					<input type="text" class="form-control" th:field="*{name}"
					       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
					<span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"/>
				</div>
				<div class="mb-3" >
					<label class="form-label">Role</label>
					<select class="form-select" th:field="*{role}">
						<option value="ADMIN">ADMIN</option>
						<option value="USER">USER</option>
					</select >
				</div>
				<div class="mb-3">
					<label class="form-label" >Email</label>
					<input type="text" class="form-control" th:field="*{email}"
					       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
					<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback"/>
				</div>
				<div class="mb-3">
					<label class="form-label" >Address</label>
					<input type="text" class="form-control" th:field="*{address}"
					       th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
					<span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="invalid-feedback"/>
				</div>
				<div>
					<button class="btn btn-warning" type="submit">
						Save
					</button>
				</div>
			</form>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
